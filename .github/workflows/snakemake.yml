name: Snakemake

on:
  push:
    branches:
      - main

jobs:
  snakemake:
    name: Run Snakemake Pipeline
    runs-on: self-hosted

    defaults:
      run:
        shell: bash -l {0}  # login shell so conda environments are sourced

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write .condarc for snakemake conda envs
        run: |
          cat > $GITHUB_WORKSPACE/.condarc << 'EOF'
          channel_priority: flexible
          channels:
            - conda-forge
            - bioconda
            - defaults
          EOF

      - name: full-run
        uses: snakemake/snakemake-github-action@v2
        env:
          CONDARC: ${{ github.workspace }}/.condarc
        with:
          snakefile: "workflow/Snakefile"
          install-apptainer: true
          args: "--directory . --cores all --sdm apptainer conda"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-results
          path: results/
          retention-days: 30
