name: Deploy JBrowse2 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "jbrowse/config.json"
  workflow_dispatch:  # allow manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JBrowse CLI
        run: npm install -g @jbrowse/cli

      - name: Download latest JBrowse2 web app
        run: |
          jbrowse create jbrowse2-app
          echo "JBrowse2 version: $(cat jbrowse2-app/version.txt)"

      - name: Copy your config.json into JBrowse2
        run: cp jbrowse/config.json jbrowse2-app/config.json

      - name: Add .nojekyll to prevent Jekyll processing
        run: touch jbrowse2-app/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jbrowse2-app/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4