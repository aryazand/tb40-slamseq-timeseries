samplesheet: "config/samples.tsv"

# ─────────────────────────────────────────────────────────────────────────────
# 1. Prep FASTQ Module Configs
# ─────────────────────────────────────────────────────────────────────────────

get_fastq:
  PE: true
  tool: "fasterq_dump"
  fastq_dump:
    extra: "-X 10000"
  fasterq_dump:
    extra: ""
trimming:
  tool: "fastp"
  fastp:
    extra: ""
  fastplong:
    extra: ""
umi_extraction:
  enabled: false  # Set to true to enable UMI extraction
  tool: "umi_tools"
  umi_tools:
    extra: ""

# ─────────────────────────────────────────────────────────────────────────────
# 2. Alignment Module Configs
# ─────────────────────────────────────────────────────────────────────────────
# Configs for obtaining genome sequence and annotation
genome:
  cmv:
    source: "ncbi" # local vs ncbi database
    prefix:
    local:
      fasta: 
      gff:
    datasets:
      genbank: "KF297339.1"
      assembly: ""
      extra: ""
  human:
    source: "ncbi" # local vs ncbi database
    prefix:
    local:
      fasta:
      gff:
    datasets:
      genbank:
      assembly: "GCF_000001405.40"
      extra: ""

# Configs for alignment tools
mapping:
  tool: "star"
  bowtie2:
    index: ""
    extra: ""
  bwa_mem2:
    extra: ""
    sort: "samtools"
    sort_order: "coordinate"
    sort_extra: ""
  star:
    index: ""
    extra: ["--outFilterMultimapNmax 10", "--outSAMmultNmax 1", "--outMultimapperOrder Random", "--alignIntronMax 1"]
  minimap2:
    index: ""
    extra: "-ax map-ont"
    sorting: "coordinate"
    sort_extra: ""

# Configs for processing post-alignment
mapping_postprocessing:
  samtools_sort:
    extra: "-m 4G"
  samtools_index:
    extra: ""
  deduplication:
    enabled: false
    tool: "picard"
    umi_tools:
      extra: "" # or directional, cluster, adjacency, etc.
    samtools:
      extra: "-c -r --no-PG"
    picard:
      extra: ""
  filter:
    cmv: "-e 'rname == \"KF297339.1\"'"
    human: "-e 'rname != \"KF297339.1\"'"

# Configs for mapping statistics
mapping_stats:
  gffread:
    extra: ""
  rseqc_infer_experiment:
    extra: ""
  rseqc_bam_stat:
    extra: ""
  deeptools_coverage:
    genome_size:
      cmv: 236000
      human: 3130250755
    extra: "--binSize 1 --normalizeUsing BPM"

# ─────────────────────────────────────────────────────────────────────────────
# 3. Common Configs
# ─────────────────────────────────────────────────────────────────────────────

qc:
  multiqc:
    extra: "--verbose"
  fastqc:
    extra: "--quiet"

# ─────────────────────────────────────────────────────────────────────────────
# 4. JBrowse Configs
# ─────────────────────────────────────────────────────────────────────────────

jbrowse:
  path_prefix: "https://js2.jetstream-cloud.org:8001/swift/v1/zandvakili-cmv-rna-seq/jurges2026-tb40-slamseq" #No trailing slash
  add_assembly:
    cmv: "--alias 'cmv_tb40' --displayName 'CMV_TB40' --force"
    human: "--alias 'human' --displayName 'Human' --force"
  add_anno:
    cmv: "--name CMV_TB40_Annotation --force"
    human: "--name Human_Annotation --force"
  add_bw:
    extra: "--force"
  add_cram:
    extra: "--force"